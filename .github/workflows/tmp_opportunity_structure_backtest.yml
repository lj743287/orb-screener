name: Temporary opportunity structure backtest

on:
  push:
    branches: [main]
    paths:
      - 'tmp/opportunity_structure_backtest.py'
      - '.github/workflows/tmp_opportunity_structure_backtest.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run opportunity structure backtest
        run: python tmp/opportunity_structure_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-structure-backtest
          path: tmp/backtest_out/
          retention-days: 3
