name: Temporary refined structure pilot
on:
  push:
    branches: [main]
    paths:
      - 'tmp/refined_structure_pilot.py'
      - '.github/workflows/tmp_refined_structure_pilot.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pandas numpy yfinance
      - name: Download first-pass artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34618539215 -n opportunity-structure-backtest -D tmp/prior_artifact
      - run: python tmp/refined_structure_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: refined-structure-pilot
          path: tmp/refined_out/
          retention-days: 3
