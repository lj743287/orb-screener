name: Research consolidated SIP export

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated equity symbols (max 250; market data only)
        required: true
        default: ONEQ
      start:
        description: First date, YYYY-MM-DD (include at least 200 warm-up sessions)
        required: true
        default: '2025-01-01'
      end:
        description: Last completed date, YYYY-MM-DD
        required: true
        default: '2026-10-29'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export historical SIP daily bars without changing scanner data
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RESEARCH_SYMBOLS: ${{ inputs.symbols }}
          RESEARCH_START: ${{ inputs.start }}
          RESEARCH_END: ${{ inputs.end }}
        run: python research/fetch_sip_history.py --symbols "$RESEARCH_SYMBOLS" --start "$RESEARCH_START" --end "$RESEARCH_END"
      - uses: actions/upload-artifact@v4
        with:
          name: research-sip-daily
          path: research_export/
          if-no-files-found: error
          retention-days: 7
