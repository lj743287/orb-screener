# .github/workflows/overnight.yml
#
# The overnight run. Four scans, strictly one after another, then the page.
#
# WHY SEQUENTIAL: the Twelve Data allowance is 55 credits per minute and it is
# counted against the API KEY, not the repo. Each big scan already runs at
# ~50 credits/min, so any two of them running together blow the limit and both
# get throttled. Chaining the jobs with "needs:" is what stops that.
#
# WHY SEPARATE JOBS AND NOT ONE LONG ONE: GitHub kills any single job at six
# hours. All four scans together take about five and a quarter, which is far
# too close to the ceiling. Each job gets its own fresh six-hour allowance.
#
# WHY MONDAY TO FRIDAY: the scan runs the same evening as the close it is
# scanning, so Monday evening scans Monday. Running Tuesday-Saturday would
# miss every Monday close and waste a run on Saturday re-scanning Friday.
#
# TIMING: 22:00 UTC is one hour after the US close in winter and two hours
# after it in summer, so the daily bars have always settled. The run finishes
# around 03:15 UTC, well before a 07:00 UK review even if GitHub starts it
# late, which it often does.

name: Overnight scans

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = run every scan, then build. build-only = just rebuild the page from the last results."
        required: true
        default: "all"
        type: choice
        options: [all, build-only]

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the intraday workflow so the two can never deploy Pages at the
# same moment. They do not overlap in time anyway, but this makes it certain.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Fastest scan first, so a broken setup shows up in ten minutes rather
  # than two hours.
  # ---------------------------------------------------------------------
  daily:
    if: github.event.inputs.mode != 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Daily scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python daily_scanner.py
      - name: Save results
        if: always()
        run: |
          git config user.name  "scan-bot"
          git config user.email "actions@github.com"
          git add -A data output || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily scanner $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi

  orb:
    needs: daily
    if: always() && github.event.inputs.mode != 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: ORB continuation screener
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          MAX_SYMBOLS: ${{ vars.MAX_SYMBOLS }}
          THROTTLE_SEC: "1.2"
          PYTHONUNBUFFERED: "1"
        run: python screener.py
      - name: Save results
        if: always()
        run: |
          git config user.name  "scan-bot"
          git config user.email "actions@github.com"
          git add -A data output docs || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ORB screen $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi

  burst:
    needs: orb
    if: always() && github.event.inputs.mode != 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Stockbee burst scan
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python burst_scan.py
      - name: Save results
        if: always()
        run: |
          git config user.name  "scan-bot"
          git config user.email "actions@github.com"
          git add -A data burst_watch.json || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Burst scan $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi

  anticipation:
    needs: burst
    if: always() && github.event.inputs.mode != 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Stockbee anticipation scan
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python anticipation_scan.py
      - name: Save results
        if: always()
        run: |
          git config user.name  "scan-bot"
          git config user.email "actions@github.com"
          git add -A data anticipation_watch.json || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Anticipation scan $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi

  # ---------------------------------------------------------------------
  # Builds the page from whatever the four scans produced. "always()" is
  # deliberate: if one scan fell over, the page must still be built so the
  # other tabs are there at 07:00, with a red banner on the one that failed.
  # ---------------------------------------------------------------------
  publish:
    needs: [daily, orb, burst, anticipation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the scans page
        run: python build_scans.py
      - name: Save page
        run: |
          git config user.name  "scan-bot"
          git config user.email "actions@github.com"
          git add -A docs || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Scans page $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
