# .github/workflows/bursts.yml
# Stockbee Anticipation pipeline.
#   Stage A (anticipation_scan.py)  — 05:30 UTC weekdays, before US open.
#        Scans the full universe for COILED pre-breakout setups (~2h).
#   Stage B (anticipation_check.py) — hourly at :07 from 14:07 to 19:07 UTC,
#        i.e. 10:07 ET to 15:07 ET during US daylight saving. Runs hourly
#        because GitHub delays scheduled jobs by 1-2 hours and because a
#        breakout is worth catching near its pivot, not hours later.
#        NOTE: when US clocks change (early Nov–mid Mar), shift the hour list
#        to 15,16,17,18,19,20 to keep the same ET window.
# Stage B copies the report into docs/ and deploys it to GitHub Pages using
# the same artifact method as the ORB Screen workflow, so it appears at
# https://lj743287.github.io/orb-screener/setups.html
# Requires repo secret TWELVE_DATA_API_KEY.

name: Burst Scanner

on:
  schedule:
    - cron: "7 5 * * 1-5"                    # Stage A: overnight scan
    - cron: "7 14,15,16,17,18,19 * * 1-5"    # Stage B: hourly during session
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run (scan or check)"
        required: true
        default: "check"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stage is decided by the clock, NOT by matching the cron string.
      # GitHub delays scheduled jobs by hours and does not reliably report the
      # schedule string, so: anything firing before midday UTC is the overnight
      # scan, anything after it is the intraday check.
      - name: Decide stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STAGE="${{ github.event.inputs.stage }}"
          elif [ "$(date -u +%H)" -lt 12 ]; then
            STAGE="scan"
          else
            STAGE="check"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Stage: $STAGE (UTC hour $(date -u +%H), event ${{ github.event_name }})"

      - name: Run Stage A — overnight anticipation scan
        if: steps.stage.outputs.stage == 'scan'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python anticipation_scan.py

      - name: Run Stage B — intraday pivot-break check
        if: steps.stage.outputs.stage == 'check'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python anticipation_check.py

      - name: Copy report into docs/
        if: steps.stage.outputs.stage == 'check'
        run: |
          mkdir -p docs
          for f in setups.html setups.json setups.txt; do
            [ -f "$f" ] && cp "$f" docs/ && echo "copied $f -> docs/"
          done

      - name: Commit results
        run: |
          git config user.name "burst-bot"
          git config user.email "actions@github.com"
          for f in anticipation_watch.json setups.html setups.json setups.txt \
                   docs/setups.html docs/setups.json docs/setups.txt; do
            [ -f "$f" ] && git add "$f" && echo "staged $f"
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit — no output files were produced"
          else
            git commit -m "Anticipation scanner update (${{ steps.stage.outputs.stage }})"
            git pull --rebase origin HEAD || true
            git push
          fi

      # Publish docs/ to GitHub Pages (same method as the ORB Screen workflow)
      - uses: actions/configure-pages@v5
        if: steps.stage.outputs.stage == 'check'

      - uses: actions/upload-pages-artifact@v3
        if: steps.stage.outputs.stage == 'check'
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.stage.outputs.stage == 'check'
